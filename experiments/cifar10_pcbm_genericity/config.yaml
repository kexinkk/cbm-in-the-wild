# PCBM genericity — CIFAR-10 (propagation sanity check; parity with the
# CIFAR DCBM/LF-CBM stage-wise study). Fills the one gap in the three-family
# §3 propagation table: CIFAR had DCBM + LF-CBM but no PCBM.
#
# Banks (grid parity with ImageNet PCBM):
#   cav  — Broden CAVs (dataset-agnostic, concepts in CLIP space); faithful primary.
#   mm   — CLIP-text of the same 166 Broden names (multimodal secondary).
#   mmL  — CLIP-text of CIFAR LF-CBM's 137-concept vocab. NOTE: not ImageNet's
#          4589-vocab (meaningless on CIFAR); the CIFAR-appropriate LF-CBM vocab
#          is the right analog of the ImageNet mmL point.
# CIFAR PCBM thus has the same {cav, mm, mmL} banks as ImageNet. Deployed pipeline: CLIP ViT-B/16 -> PCBM concept
# margins -> standardize -> head. Corrupted cells reuse
# cifar10_lfcbm_genericity/corrupted_test (same seed-42 realizations as
# cifar10_c_propagation; symlinked), so no new corrupted-image compute.
# Clean/corrupt embeddings via cached images_cifar10_*_CLIP-ViT-B16.torch (DCBM_REPO).

dataset: cifar10
clip_name: ViT-B/16
model_name: CLIP-ViT-B16
seed: 0

# --- concept-bank construction (stage A) ---
banks: [cav, mm]
n_samples: 50        # pos/neg per concept per split (fork default)
svm_C: 0.1           # linear-SVM regularizer for CAVs
head_fit_n: 50000    # CIFAR-10 train is 50k; use all for the stage-A sanity head

# large-vocabulary multimodal bank (mmL): CLIP-text embeddings of CIFAR LF-CBM's
# deployed concept list (137 concepts) — CIFAR analog of the ImageNet mmL point.
mm_large_concept_file: experiments/cifar10_lfcbm_genericity/model/concepts.txt

# --- faithful PCBM reference head (stage B: sparse elastic-net via glm_saga) ---
saga:
  lam: 0.0002
  n_iters: 60
  batch_size: 256
  chunk_epochs: 40

# --- corruption grid (matches cifar10_c_propagation) ---
corruption_set: combined     # 4 Hendrycks + 6 sensor
severities: [1, 2, 3, 4, 5]

# --- capacity-matched ablation (not the focus on CIFAR; kept for completeness) ---
ablation:
  sizes: [20, 40, 60, 80, 100, 120, 140, 160]   # cav K_full=166
  seeds: [0, 1, 2]
  fit_n: 25000
