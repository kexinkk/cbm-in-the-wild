# PCBM genericity ablation — ImageNet, FULL-VAL refit (deployed-scale twin of
# imagenet_pcbm_genericity/, mmL bank only). Identical protocol; the ONLY change
# is the head-refit fit_n (25k stratified -> full 128k val pool), so the robust-
# vs-random margin is read at deployed head strength. mmL is the paper's PCBM
# (CLIP-text, K_full~4589); cav/mm (K=166) already sit at the no-gap small-bank
# regime where 25k ~ full, so they are not re-run here. model_mmL and
# mmL_concept_shift_table.csv are symlinks back to the 25k dir; corrupted cells
# are the global imagenet_c_propagation cells (see pcbm/cells.py). Separate dir
# is required (resume-key ignores fit_n; see the LF-CBM full_val note).

dataset: imagenet
clip_name: ViT-B/16
model_name: CLIP-ViT-B16
seed: 0

banks: [mmL]

# --- corruption grid (matches imagenet_c_propagation) ---
corruption_set: combined     # 4 Hendrycks + 6 sensor
severities: [1, 2, 3, 4, 5]

# --- capacity-matched ablation, full-val refit ---
ablation:
  sizes: [20, 40, 60, 80, 100, 120, 140, 160]                   # unused for mmL
  sizes_large: [400, 800, 1200, 1600, 2000, 2400, 2800, 3200, 3600, 4000]  # mmL grid
  seeds: [0, 1, 2]
  fit_n: 200000              # >= 128k held-out val -> full pool
