# DCBM (ImageNet, K=2048): per-concept shift d_k and capacity-matched concept selection.
# CPU only; reads the per-image cells cached by experiments/imagenet_c_propagation.

dataset: imagenet
checkpoint: imagenet_baseline

grid:
  families: [fog, gaussian_noise, motion_blur, patch_masking, salt_and_pepper,
             jpeg_compression, row_column_dropout, random_pixel_dropout,
             sparse_random_occlusion, structured_pixel_dropout]
  severities: [1, 2, 3, 4, 5]
  clean_N: 50000

# run.py: d_k per concept -> concept_shift_table.csv, shift_grids.npz, summary.json
stage_run:
  seed: 0

# ablation_capacity_matched.py (settings are env overridable; defaults below).
# Arm A = native K-means bank of size K; arm B = keep the K most robust concepts of the
# frozen 2048 bank, one arm per ranking; every arm refits a fresh linear head on the full
# 128,118-image held-out val pool and is evaluated on the 50k test set (clean + sev 3).
capacity_matched:
  seeds: [0, 1, 2]                                   # SEEDS
  sizes: [100, 400, 800, 1200, 1600, 2048]           # SIZES (K = full bank)
  rank_by: [dk_hold3, rand0, rand1, rand2, geom, dkres_geom, geom_ar]   # RANK_BY
  fit_n: 0                                           # FIT_N; 0 = full held-out pool
  max_iter: 1000                                     # MAX_ITER
  n_init: 3                                          # N_INIT (K-means restarts, arm A)
  outputs: [ablation_capacity_matched.csv, ablation_capacity_matched_summary.json,
            capacity_matched/results.jsonl]
