# ImageNet Tier-2 corruption propagation — full test set, 50 cells.
#
# 10 corruption families (4 Hendrycks + 6 custom sensor) × 5 severities
# = 50 SLURM array tasks. Each task evaluates the full 50k ImageNet
# test split through the deployed-DCBM forward path (CLIP → frozen
# K=2048 bank → linear) and emits paired clean/corrupted stage metrics.
#

dataset: imagenet
seed: 42

corruption_set: combined  # 4 Hendrycks + 6 sensor

severities: [1, 2, 3, 4, 5]
device: cuda

full_test: true
