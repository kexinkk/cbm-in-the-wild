# Full-val capacity-matched refit — provenance record.
#
# This experiment REUSES the runner experiments/imagenet_concept_shift_robust_set/
# ablation_capacity_matched.py (env-driven; it does NOT parse this file). The values below
# document the exact invocation; the source of truth is scripts/slurm/
# concept_shift_robust_set_full_val/run.sbatch, and the effective params are re-emitted into
# ablation_capacity_matched_summary.json at run time.
#
# Purpose: rerun §3.2 with the head fit on the FULL 128,118-img val pool (not the 25k
# subsample) so the clean accuracy-vs-K curve is not underfit-confounded — a defensible
# single across-K curve.

env:
  FIT_N: 0                     # 0 -> full val pool (128,118); effective N stamped as fit_n
  SIZES: "100,400,800,1200,1600,K"   # K = 2048 sentinel
  RANK_BY: "dk_hold3,rand0,rand1,rand2,geom,dkres_geom,geom_ar"
  MAX_ITER: 1000
  SEEDS: [0, 1, 2]             # runner default; not overridden
  OUT_DIR: experiments/imagenet_concept_shift_robust_set_full_val
  NATIVE_CACHE: experiments/imagenet_concept_shift_robust_set/capacity_matched   # reuse cached KMeans banks

arms:                          # A_native (auto) + one B_prune_<token> per RANK_BY entry
  A_native_k:              KMeans(K) native bank (cached, fit_n-independent)
  B_prune_dk:              dk_hold3   # keep K lowest d_k, sev-3 held out (leakage-free)
  B_prune_rnd:             rand0/1/2  # selection-null band
  B_prune_min_side:        geom       # keep K largest medoid min_side
  C_prune_dkres_min_side:  dkres_geom # d_k residualized on log2(min_side)
  C_prune_ar_ratio:        geom_ar    # keep K smallest medoid AR (closest to square)

eval:
  test_n: 50000                # full clean test + 10 sev-3 corrupt cells (shared)
  sev: 3
