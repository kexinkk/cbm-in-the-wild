# LF-CBM genericity ablation — ImageNet.
#
# Deployed pipeline: CLIP ViT-B/16 → W_c concept projection → standardize
# → sparse GLM-SAGA head. Trained on cached clean embeddings
# (DCBM/data/Embeddings/images_ImageNet_*_CLIP-ViT-B16.torch: train 1.15M,
# val 128k held-out, test 50k). Corrupted eval reuses the 50 full-test
# per-image cells of experiments/imagenet_c_propagation (clip_emb key) —
# zero new corrupted-image compute, no raw ImageNet-C access.

dataset: imagenet
clip_name: ViT-B/16
model_name: CLIP-ViT-B16
seed: 0                      # model seed; ablation refit seeds below

# --- LF-CBM training (upstream imagenet settings, training_commands.txt) ---
concept_set: data/concept_sets/imagenet_filtered.txt  # relative to LFCBM_REPO
clip_cutoff: 0.28
interpretability_cutoff: 0.45
proj_steps: 1000
proj_batch_size: 50000
saga:
  lam: 0.0001
  n_iters: 80
  batch_size: 256
  chunk_epochs: 15           # per 25-min job; afterany waves resume (exact
                             # warm restart via native glm_saga state)

# --- corruption grid (matches imagenet_c_propagation) ---
corruption_set: combined     # 4 Hendrycks + 6 sensor
severities: [1, 2, 3, 4, 5]

# --- capacity-matched ablation ---
ablation:
  # even-spaced grid over the 4589-concept bank; K_full (4589) appended at
  # runtime as the inert anchor where all arms coincide by construction.
  sizes: [400, 800, 1200, 1600, 2000, 2400, 2800, 3200, 3600, 4000]
  seeds: [0, 1, 2]
  fit_n: 25000               # stratified from 128k held-out val (mirrors DCBM)
