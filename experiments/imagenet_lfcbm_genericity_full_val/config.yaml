# LF-CBM genericity ablation — ImageNet, FULL-VAL refit (deployed-scale twin
# of imagenet_lfcbm_genericity/). Identical protocol; the ONLY change is the
# head-refit fit_n (25k stratified -> full 128k val pool), so the robust-vs-
# random margin is read at deployed head strength rather than the 25k-underfit
# regime. Mirrors experiments/imagenet_concept_shift_robust_set_full_val/ for
# DCBM. model/ and concept_shift_table.csv are symlinks back to the 25k dir
# (fit_n-independent artifacts); corrupted cells are the global
# imagenet_c_propagation cells (see lfcbm/cells.py). Separate dir is required:
# the ablation resume-key is (rank,K,seed) and ignores fit_n, so reusing the
# 25k dir would skip every cell as "done" and mix two fit regimes in one CSV.

dataset: imagenet
clip_name: ViT-B/16
model_name: CLIP-ViT-B16
seed: 0

# --- corruption grid (matches imagenet_c_propagation) ---
corruption_set: combined     # 4 Hendrycks + 6 sensor
severities: [1, 2, 3, 4, 5]

# --- capacity-matched ablation, full-val refit ---
ablation:
  sizes: [400, 800, 1200, 1600, 2000, 2400, 2800, 3200, 3600, 4000]
  seeds: [0, 1, 2]
  fit_n: 200000              # >= 128k held-out val -> uses the full pool
                             # (_stratified_idx caps per-class at availability)
